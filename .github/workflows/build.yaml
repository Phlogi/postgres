name: Build PostgreSQL Container

on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'LICENSE', '.gitignore']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: 'Tag to rebuild (blank = all)'
        required: false
        type: string
      registry:
        description: 'Registry prefix (fork testing only)'
        required: false
        type: string
        default: 'ghcr.io/daemonless'
      arch:
        description: 'Architecture filter (fork testing only)'
        required: false
        type: string

jobs:
  build:
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: read
    uses: daemonless/workflows/.github/workflows/daemonless-build.yaml@v1
    with:
      image_name: postgres
      variant: ${{ inputs.variant }}
      registry: ${{ inputs.registry || 'ghcr.io/daemonless' }}
      arch: ${{ inputs.arch }}
    secrets: inherit
